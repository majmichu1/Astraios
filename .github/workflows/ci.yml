name: Quality Gate

# Runs on every push to main and every PR: lint (bug classes), type check
# (non-blocking while debt remains), and the full test suite. The release
# workflow (build.yml) only builds installers on tags — this job is what
# stops regressions from reaching a release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Supersede stale PR runs, but give every push to main its own group.
#
# cancel-in-progress: false is NOT enough to protect main. GitHub keeps only
# one *pending* run per group, so while one main run was executing, the next
# commit queued behind it and the commit after that cancelled it -- 30c0875
# sat pending for 26 minutes, never started a job, and was reported as
# "cancelled". That both skips commits and recreates the exact unexplainable
# red X this workflow was being fixed to remove.
#
# Keying main's group by SHA means main runs never contend with each other.
concurrency:
  group: quality-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    runs-on: ubuntu-22.04
    # The suite is not slow, it hangs. Timestamps in the run on ff61485 show
    # it going 75% -> 92% in 93 seconds and then sitting still for 55 minutes
    # until the job timeout. Raising this to 60 was treating the wrong cause:
    # a blocked test never finishes, so a bigger budget only buys a longer
    # wait. 92% is where tests/test_ui starts, and the suite passes locally in
    # about four minutes, so this is a CI-only block in a Qt test.
    #
    # 30 is roughly six times the real runtime: enough headroom for a slow
    # runner, short enough that a hang is reported quickly. See
    # faulthandler_timeout in pyproject.toml, which names the culprit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Same library set validate-installer.yml needs for PyQt6 to import
      # offscreen on a bare runner.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxcb-cursor0 libxkbcommon0 libxinerama1 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 >/dev/null

      # Resolving torch on Linux pulls the CUDA build: ~2 GB of nvidia_*
      # wheels onto a runner with no GPU. That is a large download to get
      # through intact, and one dropped connection inside it currently fails
      # the entire gate -- which is exactly how the run on 11beb17 died, with
      # a ReadTimeoutError partway through the nvidia wheels rather than
      # anything wrong in the code. Retry before believing it.
      #
      # Deliberately not pinning CI to a CPU-only torch: that pin lives in
      # pyproject, and forcing it there would take the GPU away from local
      # development to paper over a network flake.
      - name: Install dependencies
        run: |
          pip install --no-cache-dir poetry
          for attempt in 1 2 3; do
            if poetry install --extras dev; then
              exit 0
            fi
            echo "::warning::dependency install attempt ${attempt} failed; retrying"
            sleep $((attempt * 20))
          done
          echo "::error::dependency install failed 3 times -- not a flake"
          exit 1

      # Tighten the selection (towards the full pyproject config) as the
      # remaining style debt is paid down. E9+F is the bug-hunting core:
      # syntax errors, undefined names, unused imports/locals.
      - name: Ruff — bug classes (E9 + F)
        run: poetry run ruff check --select E9,F .

      - name: Mypy (non-blocking until the type debt is paid down)
        continue-on-error: true
        run: poetry run mypy astraios --ignore-missing-imports

      # --durations prints the slowest tests as measured on the runner itself.
      # That is the only trustworthy source for this number: a dev workstation
      # has a different core count and competing load, so local timings say
      # nothing about how long this box takes. If the suite creeps back toward
      # the cap, read that list rather than guessing at a speed-up.
      # -v so the last line of a stalled log names the test that blocked.
      # Under -q a hang shows only a row of dots and a percentage, which is
      # what made this take so long to pin down.
      - name: Test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: poetry run pytest -v --durations=25
