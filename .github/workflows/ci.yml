name: Quality Gate

# Runs on every push to main and every PR: lint (bug classes), type check
# (non-blocking while debt remains), and the full test suite. The release
# workflow (build.yml) only builds installers on tags — this job is what
# stops regressions from reaching a release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A run that has already been superseded is worthless, and this job is long
# enough that a burst of pushes otherwise queues several of them behind each
# other. Never cancel on main, though: that is the history the gate exists to
# certify, and a cancelled run there reads as a failure nobody can explain.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    runs-on: ubuntu-22.04
    # Was 30, which the suite outgrew: runs were dying at ~92% complete, so
    # the gate reported "cancelled" (GitHub's wording for a timeout) on every
    # commit and the regression net silently stopped covering anything. The
    # runner is a small CPU-only box, so the suite legitimately takes far
    # longer there than on a dev machine. This is a hang backstop, not a
    # performance target -- see --durations below for the real numbers.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Same library set validate-installer.yml needs for PyQt6 to import
      # offscreen on a bare runner.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxcb-cursor0 libxkbcommon0 libxinerama1 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 >/dev/null

      - name: Install dependencies
        run: |
          pip install --no-cache-dir poetry
          poetry install --extras dev

      # Tighten the selection (towards the full pyproject config) as the
      # remaining style debt is paid down. E9+F is the bug-hunting core:
      # syntax errors, undefined names, unused imports/locals.
      - name: Ruff — bug classes (E9 + F)
        run: poetry run ruff check --select E9,F .

      - name: Mypy (non-blocking until the type debt is paid down)
        continue-on-error: true
        run: poetry run mypy astraios --ignore-missing-imports

      # --durations prints the slowest tests as measured on the runner itself.
      # That is the only trustworthy source for this number: a dev workstation
      # has a different core count and competing load, so local timings say
      # nothing about how long this box takes. If the suite creeps back toward
      # the cap, read that list rather than guessing at a speed-up.
      - name: Test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: poetry run pytest -q --durations=25
