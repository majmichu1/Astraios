name: Validate Installers

# Runs the REAL install-time bootstrap on genuine Windows, Linux and macOS
# runners (macOS on both Apple Silicon and Intel), so the
# installer is verified end-to-end without needing a local Windows machine.
# The runner has no NVIDIA GPU, so this exercises the CPU path; the only
# difference for GPU users is the torch index URL (checked separately by a
# dry-run resolve of the cu128 wheels).

on:
  push:
    branches: [main]
    paths:
      - 'packaging/windows/**'
      - 'packaging/linux/**'
      - 'packaging/macos/**'
      - '.github/workflows/validate-installer.yml'
      # The Metal-vs-CPU check is only ever exercised by this workflow, since
      # no other machine here has Apple hardware. Without it in this list a
      # change to the check itself would ship unvalidated.
      - 'scripts/mps_check.py'
      - 'pyproject.toml'
      - 'astraios/__init__.py'
      - 'astraios/__main__.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build the wheel
        run: |
          pip install --no-cache-dir poetry
          poetry build --format wheel

      - name: Download uv
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip" -OutFile uv.zip
          Expand-Archive uv.zip uv_extract -Force

      - name: Stage an install dir (what the installer lays down)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force testinstall | Out-Null
          Copy-Item uv_extract\uv.exe testinstall\
          Copy-Item dist\*.whl testinstall\
          Copy-Item packaging\windows\bootstrap.ps1 testinstall\

      - name: Run the real bootstrap (venv + torch + app + import smoke)
        shell: pwsh
        run: |
          $dir = (Resolve-Path testinstall).Path
          powershell -NoProfile -ExecutionPolicy Bypass -File "$dir\bootstrap.ps1" -AppDir "$dir"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "----- setup.log -----"
            Get-Content "$dir\setup.log" -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Verify the shortcut target (pythonw.exe) exists
        shell: pwsh
        run: |
          $pyw = "testinstall\.venv\Scripts\pythonw.exe"
          if (-not (Test-Path $pyw)) {
            Write-Host "::error::pythonw.exe missing in the venv — the Start Menu/desktop shortcut target would be broken"
            Get-ChildItem testinstall\.venv\Scripts
            exit 1
          }
          Write-Host "pythonw.exe present: $pyw"

      - name: Launch test — construct the GUI offscreen
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $py = "testinstall\.venv\Scripts\python.exe"
          & $py -c "from PyQt6.QtWidgets import QApplication; from astraios.ui.main_window import MainWindow; app=QApplication([]); w=MainWindow(); w.close(); print('GUI constructs and closes OK')"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Confirm the GPU (cu128) wheels resolve for py3.11
        shell: pwsh
        run: |
          & testinstall\uv.exe pip install --python testinstall\.venv\Scripts\python.exe --dry-run torch torchvision --index-url https://download.pytorch.org/whl/cu128
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::cu128 GPU wheels did not resolve — the GPU install path would fail"
            exit 1
          }
          Write-Host "cu128 GPU wheels resolve OK"

  # Runs the REAL Linux installer end-to-end on a clean Ubuntu runner (no GPU →
  # CPU path). Validates uv download/extract, venv creation, torch install,
  # downloading the wheel from the latest release, the app install, and the
  # import smoke test — i.e. exactly what a Linux user's machine would do.
  validate-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Run the Linux installer end-to-end
        run: bash packaging/linux/install-astraios.sh

      - name: Confirm the install works + GUI imports (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxcb-cursor0 libxkbcommon0 libxcb-xinerama0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 >/dev/null
          PY="$HOME/.local/share/Astraios/venv/bin/python"
          "$PY" -c "import astraios, torch; print('install OK', astraios.__version__, '| torch', torch.__version__)"
          "$PY" -c "from PyQt6.QtWidgets import QApplication; import astraios.ui.main_window; app=QApplication([]); print('GUI module imports OK')"

  # Real Apple hardware, both architectures: arm64 (Apple Silicon, where the
  # Metal/MPS backend matters) and x86_64 (Intel). Without this the macOS
  # installer would be untested code, since it cannot be exercised on Linux.
  validate-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest     # Apple Silicon (arm64)
            arch: arm64
          # macos-13 was RETIRED in December 2025; a job targeting it queues
          # forever rather than failing, so the workflow never reports. The
          # current Intel label is macos-15-intel, which GitHub has said is
          # the last Intel image and goes away in autumn 2027.
          - runner: macos-15-intel   # Intel (x86_64)
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Confirm the runner architecture matches the matrix
        run: |
          echo "uname -m: $(uname -m)  expected: ${{ matrix.arch }}"
          test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Run the macOS installer end-to-end
        run: bash packaging/macos/install-astraios-macos.sh

      - name: Confirm the install works and the GUI imports (offscreen)
        run: |
          PY="$HOME/Library/Application Support/Astraios/venv/bin/python"
          "$PY" -c "import astraios, torch; print('install OK', astraios.__version__, '| torch', torch.__version__)"
          QT_QPA_PLATFORM=offscreen "$PY" -c "from PyQt6.QtWidgets import QApplication; import astraios.ui.main_window; app=QApplication([]); print('GUI module imports OK')"

      - name: Confirm the compute backend Astraios will actually use
        run: |
          PY="$HOME/Library/Application Support/Astraios/venv/bin/python"
          "$PY" - <<'PYCHECK'
          import torch
          from astraios.core.device_manager import get_device_manager
          mps = getattr(torch.backends, "mps", None)
          available = bool(mps and mps.is_available())
          dm = get_device_manager()
          print(f"MPS available: {available} | Astraios backend: {dm.backend}")
          # Apple Silicon must land on the Metal backend, not silently on CPU.
          import platform
          if platform.machine() == "arm64":
              assert available, "MPS unavailable on Apple Silicon"
              assert dm.is_gpu, f"Astraios fell back to {dm.backend} on Apple Silicon"
          PYCHECK

      - name: Confirm the app bundle is launchable
        run: |
          APP="$HOME/Applications/Astraios.app"
          test -d "$APP" || { echo "app bundle missing"; exit 1; }
          test -x "$APP/Contents/MacOS/astraios" || { echo "launcher not executable"; exit 1; }
          plutil -lint "$APP/Contents/Info.plist"
          echo "Astraios.app is present and its Info.plist is valid"

      # Selecting Metal is not the same as working on Metal. MPS has real
      # holes -- no float64, some ops unimplemented, some silently taking a
      # CPU fallback -- so a tool can pick the GPU, run, and hand back wrong
      # pixels while every import check above still passes. Run the real tools
      # on both backends and compare.
      #
      # This is also the only place the project can get a trustworthy number
      # about Apple hardware, since nobody here owns a Mac. The timings are
      # printed in the job log and are what any "is MPS worth it for this
      # tool" decision should be based on.
      # PYTHONPATH puts the checked-out source ahead of site-packages, so this
      # measures the code we are about to ship rather than the code already
      # released. That distinction is not academic: the first run of this
      # check went red on v0.1.24-alpha, where morphology_transform took the
      # GPU path for a CIRCLE element (a square max_pool window) while the CPU
      # path used cv2.MORPH_ELLIPSE -- different kernel shapes, 0.236 max
      # difference, wrong pixels on every Mac. Commit 9238349 had already
      # fixed that on main. Gating on the release would keep this job red
      # until the next release and tell us nothing about new work, so gate on
      # the source and let the release be validated by the installer steps
      # above.
      - name: Verify the tools agree between Metal and CPU, and time them
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          PY="$HOME/Library/Application Support/Astraios/venv/bin/python"
          "$PY" -c "import astraios, pathlib; print('checking:', pathlib.Path(astraios.__file__).parent)"
          # Sweep sizes rather than trusting one. Transfer cost grows with
          # pixel count while kernel-launch overhead does not, so a tool that
          # loses on a 256px preview can still win on a real frame, and a
          # routing decision made from a single size would be wrong for half
          # the images users actually process. 2048 is the ceiling here to
          # keep the runner comfortably inside its memory.
          "$PY" scripts/mps_check.py --bench 3 --sizes 256,1024,2048

