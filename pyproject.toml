[project]
name = "astraios"
version = "0.1.25"
description = "Free, open-source GPU-accelerated astrophotography processing: calibration, registration, stacking, denoising and more (alpha)"
authors = [
    {name = "Astraios Contributors"}
]
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11,<3.15"
keywords = ["astrophotography", "astronomy", "image-processing", "image-stacking", "FITS", "XISF", "deep-sky", "planetary-imaging", "GPU", "CUDA", "Metal", "PyTorch", "denoising", "deconvolution", "plate-solving", "photometry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Multimedia :: Graphics",
]


dependencies = [
    "PyQt6>=6.6,<7",
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "astropy>=6.0",
    "ccdproc>=2.4",
    "opencv-python-headless>=4.9,<5",
    "Pillow>=10.2",
    "requests>=2.31,<3",
    "packaging>=24.0",
    "platformdirs>=4.2,<5",
    "qimage2ndarray>=1.10,<2",
    "PyWavelets>=1.5",
    "scikit-image>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-qt>=4.3,<5",
    "pytest-cov>=4.1,<6",
    "ruff>=0.3,<1",
    "mypy>=1.8,<2",
    "pdoc>=14,<15",
]
build = [
    "pyinstaller>=6.4,<7",
]

[project.scripts]
astraios = "astraios.__main__:main"

[project.gui-scripts]
astraios-gui = "astraios.__main__:main"
[project.urls]
Homepage = "https://majmichu1.github.io/Astraios/"
Repository = "https://github.com/majmichu1/Astraios"
Documentation = "https://github.com/majmichu1/Astraios/tree/main/docs"
Issues = "https://github.com/majmichu1/Astraios/issues"
Changelog = "https://github.com/majmichu1/Astraios/blob/main/CHANGELOG.md"
Releases = "https://github.com/majmichu1/Astraios/releases"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "astraios"}]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# "N" (pep8-naming) is intentionally not selected: this codebase follows
# Qt's camelCase overrides (closeEvent, paintEvent, ...) and
# astrophysics-math naming (N/H/W/M/L, scalar constants in functions).
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# UP042: the (str, Enum) mixin is kept deliberately — members are compared
# against and serialized as plain strings across presets, pipelines and UI.
ignore = ["UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Dump every thread's stack if one test runs this long. A test that blocks
# forever otherwise looks identical to a slow suite from the outside: the CI
# job just stops at some percentage and eventually hits the job timeout, with
# nothing in the log naming the test or saying where it stopped. This is
# pytest's built-in faulthandler, so it costs no dependency and does nothing
# at all until something actually hangs. No real test here comes close to
# 120s; the whole suite runs in about four minutes.
faulthandler_timeout = 120

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
